<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <linearGradient id="lifeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1020" />
      <stop offset="100%" stop-color="#11182B" />
    </linearGradient>

    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#F5C76B" />
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>

    <style>
      .spin-ring {
        animation: spinRing 25s linear infinite;
        transform-origin: 500px 260px;
      }
      .node-pulse {
        animation: pulseNode 3s ease-in-out infinite alternate;
      }
      @keyframes spinRing {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseNode {
        0% { transform: scale(0.96); }
        100% { transform: scale(1.04); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="480" rx="20" fill="url(#lifeBg)" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Diagram Title -->
  <g transform="translate(50, 45)">
    <rect x="0" y="0" width="180" height="24" rx="12" fill="rgba(245,199,107,0.18)" stroke="rgba(245,199,107,0.4)" stroke-width="1" />
    <text x="12" y="16" fill="#FDE68A" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">DIAGRAM 3 : EVENT LIFECYCLE</text>
    <text x="0" y="50" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="800">Five-Stage Celebration Orchestration Loop</text>
  </g>

  <!-- Central Glowing Ambient -->
  <circle cx="500" cy="260" r="160" fill="url(#centerGlow)" />

  <!-- Animated Rotating Track -->
  <g class="spin-ring">
    <circle cx="500" cy="260" r="130" fill="none" stroke="url(#ringGrad)" stroke-width="2" stroke-dasharray="12 8" opacity="0.6" />
    <circle cx="500" cy="130" r="6" fill="#F5C76B" />
    <circle cx="630" cy="260" r="5" fill="#8B5CF6" />
    <circle cx="500" cy="390" r="6" fill="#34D399" />
    <circle cx="370" cy="260" r="5" fill="#6366F1" />
  </g>

  <!-- Center Core Logo Badge -->
  <g transform="translate(440, 200)">
    <rect width="120" height="120" rx="28" fill="#171F35" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
    <circle cx="60" cy="60" r="32" fill="rgba(139,92,246,0.2)" />
    <!-- Spark icon -->
    <path d="M60 42 L63 53 L74 56 L63 59 L60 70 L57 59 L46 56 L57 53 Z" fill="#F5C76B" />
    <text x="60" y="88" fill="#F8FAFC" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">PromptWars</text>
    <text x="60" y="100" fill="#A78BFA" font-family="sans-serif" font-size="9" text-anchor="middle">Core Engine</text>
  </g>

  <!-- Stage Node 1: Vision & AI Prompt (Top Left) -->
  <g transform="translate(100, 120)" class="node-pulse">
    <rect width="170" height="90" rx="14" fill="#171F35" stroke="rgba(139,92,246,0.5)" stroke-width="1.5" />
    <rect x="12" y="10" width="24" height="24" rx="6" fill="rgba(139,92,246,0.3)" />
    <text x="24" y="26" fill="#C4B5FD" font-family="sans-serif" font-size="12" font-weight="900" text-anchor="middle">1</text>
    <text x="44" y="26" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="700">Prompt Vision</text>
    <text x="12" y="52" fill="#94A3B8" font-family="sans-serif" font-size="10">Natural language brief,</text>
    <text x="12" y="66" fill="#94A3B8" font-family="sans-serif" font-size="10">target guests &amp; budget</text>
  </g>

  <!-- Stage Node 2: Blueprint & Validation (Top Right) -->
  <g transform="translate(730, 120)" class="node-pulse">
    <rect width="170" height="90" rx="14" fill="#171F35" stroke="rgba(99,102,241,0.5)" stroke-width="1.5" />
    <rect x="12" y="10" width="24" height="24" rx="6" fill="rgba(99,102,241,0.3)" />
    <text x="24" y="26" fill="#A5B4FC" font-family="sans-serif" font-size="12" font-weight="900" text-anchor="middle">2</text>
    <text x="44" y="26" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="700">AI Blueprint</text>
    <text x="12" y="52" fill="#94A3B8" font-family="sans-serif" font-size="10">Schema validation,</text>
    <text x="12" y="66" fill="#94A3B8" font-family="sans-serif" font-size="10">6-category budget split</text>
  </g>

  <!-- Stage Node 3: Operations & Lock-in (Right Center) -->
  <g transform="translate(750, 260)" class="node-pulse">
    <rect width="170" height="90" rx="14" fill="#171F35" stroke="rgba(245,199,107,0.5)" stroke-width="1.5" />
    <rect x="12" y="10" width="24" height="24" rx="6" fill="rgba(245,199,107,0.3)" />
    <text x="24" y="26" fill="#F5C76B" font-family="sans-serif" font-size="12" font-weight="900" text-anchor="middle">3</text>
    <text x="44" y="26" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="700">Venues &amp; Vendors</text>
    <text x="12" y="52" fill="#94A3B8" font-family="sans-serif" font-size="10">Discover facilities,</text>
    <text x="12" y="66" fill="#94A3B8" font-family="sans-serif" font-size="10">dispatch booking inquiries</text>
  </g>

  <!-- Stage Node 4: Guest RSVPs & Invites (Bottom Left) -->
  <g transform="translate(80, 260)" class="node-pulse">
    <rect width="170" height="90" rx="14" fill="#171F35" stroke="rgba(236,72,153,0.5)" stroke-width="1.5" />
    <rect x="12" y="10" width="24" height="24" rx="6" fill="rgba(236,72,153,0.3)" />
    <text x="24" y="26" fill="#F472B6" font-family="sans-serif" font-size="12" font-weight="900" text-anchor="middle">4</text>
    <text x="44" y="26" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="700">RSVPs &amp; Invites</text>
    <text x="12" y="52" fill="#94A3B8" font-family="sans-serif" font-size="10">Digital invitation suite,</text>
    <text x="12" y="66" fill="#94A3B8" font-family="sans-serif" font-size="10">dietary notes &amp; CSV export</text>
  </g>

  <!-- Stage Node 5: Execution & Auditing (Bottom Center) -->
  <g transform="translate(415, 365)" class="node-pulse">
    <rect width="170" height="90" rx="14" fill="#171F35" stroke="rgba(52,211,153,0.5)" stroke-width="1.5" />
    <rect x="12" y="10" width="24" height="24" rx="6" fill="rgba(52,211,153,0.3)" />
    <text x="24" y="26" fill="#34D399" font-family="sans-serif" font-size="12" font-weight="900" text-anchor="middle">5</text>
    <text x="44" y="26" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="700">Execution &amp; Audit</text>
    <text x="12" y="52" fill="#94A3B8" font-family="sans-serif" font-size="10">Kanban milestone flow,</text>
    <text x="12" y="66" fill="#94A3B8" font-family="sans-serif" font-size="10">budget guard &amp; live audit</text>
  </g>
</svg>
